<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%232a2220%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2742%27%20font-family%3D%27Georgia%2Cserif%27%20font-size%3D%2730%27%20text-anchor%3D%27middle%27%20fill%3D%27%23d6bb88%27%3EL%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عيادات لايف ويز | Life Way's Clinics — Riyadh</title>
<meta name="description" content="Life Way's Clinics — dermatology, cosmetics and laser clinic in Riyadh. عيادات لايف ويز — الجلدية والتجميل والليزر في الرياض.">
<meta name="theme-color" content="#16120f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16120f; --ink2:#1f1a16; --ivory:#f6f0e7; --sand:#ebe1d1; --gold:#b08d57; --gold-l:#d6bb88; --muted:#8a7f72;
  --f-disp:'Cormorant Garamond','Amiri',serif; --f-body:'Jost','IBM Plex Sans Arabic',sans-serif;
  --ease:cubic-bezier(.2,.7,.1,1);
}
html[lang=ar]{--f-disp:'Amiri','Cormorant Garamond',serif; --f-body:'IBM Plex Sans Arabic','Jost',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{font-family:var(--f-body);background:var(--ivory);color:var(--ink);font-weight:300;line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--gold);color:#fff}
.wrap{width:min(1200px,100% - 48px);margin-inline:auto}
section{position:relative}
.eyebrow{font-size:.74rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:400;display:inline-flex;align-items:center;gap:14px}
html[lang=ar] .eyebrow{letter-spacing:.08em;font-size:.85rem}
.eyebrow::before{content:"";width:36px;height:1px;background:currentColor}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;line-height:1.08;letter-spacing:-.01em}
html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3{line-height:1.35;letter-spacing:0}
h2{font-size:clamp(2.2rem,5vw,4rem)}
.lead{font-size:1.05rem;color:var(--muted);max-width:52ch}
.dark{background:var(--ink);color:var(--ivory)}
.dark .lead{color:#b9ad9d}

/* loader */
#loader{position:fixed;inset:0;z-index:9999;background:var(--ink);display:grid;place-items:center;color:var(--ivory)}
#loader .mark{text-align:center}
#loader .lw{font-family:'Cormorant Garamond',serif;font-size:clamp(3rem,10vw,6rem);letter-spacing:.12em;font-weight:300;overflow:hidden;display:block}
#loader .lw span{display:inline-block}
#loader .bar{width:160px;height:1px;background:#ffffff22;margin:22px auto 14px;overflow:hidden}
#loader .bar i{display:block;height:100%;width:100%;background:var(--gold-l);transform:scaleX(0);transform-origin:left}
#loader small{font-size:.7rem;letter-spacing:.4em;color:var(--gold-l);text-transform:uppercase;opacity:0}

/* nav */
header{position:fixed;inset:0 0 auto 0;z-index:100;transition:transform .5s var(--ease),background .4s,backdrop-filter .4s}
header.solid{background:#f6f0e7d9;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
header.hide{transform:translateY(-100%)}
.nav{display:flex;align-items:center;justify-content:space-between;height:78px}
.brand{font-family:'Cormorant Garamond',serif;font-size:1.45rem;letter-spacing:.14em;font-weight:500;display:flex;align-items:center;gap:12px}
.brand svg{width:30px;height:30px}
.navlinks{display:flex;gap:34px;font-size:.88rem}
.navlinks a{position:relative;padding:4px 0}
.navlinks a::after{content:"";position:absolute;inset-inline:0;bottom:0;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:center;transition:transform .45s var(--ease)}
.navlinks a:hover::after{transform:scaleX(1)}
.navr{display:flex;align-items:center;gap:14px}
.lang{border:1px solid currentColor;border-radius:99px;padding:6px 16px;font-size:.8rem;letter-spacing:.1em;transition:.3s}
.lang:hover{background:var(--ink);color:var(--ivory);border-color:var(--ink)}
header.onDark{color:var(--ivory)}
header.onDark .lang:hover{background:var(--ivory);color:var(--ink);border-color:var(--ivory)}
.btn{display:inline-flex;align-items:center;gap:12px;padding:15px 30px;border-radius:99px;font-size:.92rem;font-weight:400;position:relative;overflow:hidden;transition:transform .4s var(--ease),box-shadow .4s;isolation:isolate}
.btn.gold{background:var(--gold);color:#fff}
.btn.gold::before{content:"";position:absolute;inset:0;background:var(--ink);transform:translateY(101%);transition:transform .5s var(--ease);z-index:-1}
.btn.gold:hover::before{transform:translateY(0)}
.btn.line{border:1px solid currentColor}
.btn.line:hover{background:var(--ivory);color:var(--ink)}
.btn svg{width:18px;height:18px;transition:transform .4s var(--ease)}
.btn:hover svg{transform:translateX(4px)}
[dir=rtl] .btn:hover svg{transform:translateX(-4px)}
.burger{display:none;width:40px;height:40px;position:relative}
.burger i{position:absolute;inset-inline:9px;height:1px;background:currentColor;transition:.4s var(--ease)}
.burger i:nth-child(1){top:15px}.burger i:nth-child(2){top:24px}
.burger.on i:nth-child(1){top:20px;transform:rotate(45deg)}.burger.on i:nth-child(2){top:20px;transform:rotate(-45deg)}
.menu{position:fixed;inset:0;background:var(--ink);color:var(--ivory);z-index:90;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:26px;font-family:var(--f-disp);font-size:2.2rem;clip-path:circle(0 at 100% 0);transition:clip-path .8s var(--ease);pointer-events:none}
.menu.on{clip-path:circle(150% at 100% 0);pointer-events:auto}

/* hero */
.hero{min-height:100svh;display:flex;align-items:center;overflow:hidden;background:
  radial-gradient(1200px 700px at 80% 20%,#efe3cd 0%,transparent 60%),var(--ivory)}
.hero .orb{position:absolute;border-radius:50%;filter:blur(2px);will-change:transform}
.o1{width:min(46vw,560px);aspect-ratio:1;inset-inline-end:-6vw;top:8vh;background:radial-gradient(circle at 30% 30%,#e9d3a6,#b08d57 60%,#8a6a3a);opacity:.9}
.o2{width:min(22vw,260px);aspect-ratio:1;inset-inline-end:34vw;bottom:10vh;border:1px solid var(--gold);opacity:.7}
.o3{width:min(10vw,120px);aspect-ratio:1;inset-inline-start:8vw;top:20vh;background:var(--ink);opacity:.9}
.hero svg.rings{position:absolute;inset-inline-end:-10vw;top:-4vh;width:min(70vw,860px);opacity:.5;pointer-events:none}
.hero .inner{position:relative;z-index:2;padding:140px 0 90px;max-width:760px}
.hero h1{font-size:clamp(3rem,8.4vw,7.2rem);margin:26px 0 28px}
html[lang=ar] .hero h1{font-size:clamp(2.8rem,7.4vw,6.2rem)}
.hero h1 .ln{display:block;overflow:hidden}
.hero h1 .ln>span{display:inline-block}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero .cta{display:flex;gap:16px;flex-wrap:wrap;margin-top:42px}
.scrollhint{position:absolute;bottom:28px;inset-inline-start:24px;font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;display:flex;align-items:center;gap:12px;color:var(--muted);z-index:2}
.scrollhint i{width:1px;height:46px;background:linear-gradient(var(--gold),transparent);animation:drip 2.2s infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.badge{position:absolute;z-index:3;inset-inline-end:max(24px,calc((100vw - 1200px)/2));bottom:48px;background:#16120fe6;color:var(--ivory);padding:18px 24px;border-radius:18px;display:flex;gap:16px;align-items:center;backdrop-filter:blur(8px)}
.badge b{font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:400;line-height:1;color:var(--gold-l)}
.badge small{display:block;font-size:.78rem;color:#c9bca9;line-height:1.4}
.stars{color:var(--gold-l);letter-spacing:3px;font-size:.82rem}

/* marquee */
.marq{background:var(--ink);color:var(--gold-l);padding:22px 0;overflow:hidden;white-space:nowrap}
.marq .track{display:inline-flex;gap:56px;animation:marq 38s linear infinite;font-family:var(--f-disp);font-size:clamp(1.4rem,3vw,2.2rem);font-style:italic}
html[lang=ar] .marq .track{font-style:normal}
.marq span::after{content:"✦";margin-inline-start:56px;font-size:.7em;color:var(--gold)}
@keyframes marq{to{transform:translateX(-50%)}}
[dir=rtl] .marq .track{animation-name:marqr}
@keyframes marqr{to{transform:translateX(50%)}}

/* services */
.pad{padding:clamp(90px,14vw,180px) 0}
.head{display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:end;margin-bottom:70px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{position:relative;padding:44px 34px 38px;border:1px solid #16120f1a;border-radius:4px;background:#fff8;overflow:hidden;transition:transform .6s var(--ease),border-color .4s,box-shadow .6s;min-height:360px;display:flex;flex-direction:column}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(500px circle at var(--mx,50%) var(--my,0%),#d6bb8833,transparent 45%);opacity:0;transition:opacity .4s}
.card:hover{transform:translateY(-8px);border-color:var(--gold);box-shadow:0 30px 60px -30px #16120f55}
.card:hover::before{opacity:1}
.card .n{font-family:'Cormorant Garamond',serif;font-size:.95rem;color:var(--gold);letter-spacing:.2em}
.card .ico{width:64px;height:64px;margin:34px 0 26px;color:var(--gold)}
.card h3{font-size:2rem;margin-bottom:12px}
.card p{color:var(--muted);font-size:.97rem}
.card .arrow{margin-top:auto;padding-top:26px;font-size:.85rem;color:var(--gold);display:flex;align-items:center;gap:10px}

/* pinned story */
.story{height:100svh;overflow:hidden;background:var(--ink);color:var(--ivory)}
.story .stage{position:relative;height:100%;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:60px}
.story .left{position:relative;height:60vh}
.story .step{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;opacity:0}
.story .step:first-child{opacity:1}
.story .step h3{font-size:clamp(2.4rem,5vw,4.4rem);margin:18px 0 22px}
.story .step p{color:#b9ad9d;max-width:44ch;font-size:1.05rem}
.story .num{font-family:'Cormorant Garamond',serif;font-size:1rem;letter-spacing:.3em;color:var(--gold-l)}
.story .right{position:relative;height:min(64vh,560px);display:grid;place-items:center}
.story .art{position:absolute;inset:0;display:grid;place-items:center;opacity:0}
.story .art:first-child{opacity:1}
.story svg{width:min(100%,460px);height:auto}
.prog{position:absolute;inset-inline:0;bottom:6vh;display:flex;gap:10px;justify-content:center}
.prog i{width:64px;height:2px;background:#ffffff26;overflow:hidden;position:relative}
.prog i b{position:absolute;inset:0;background:var(--gold-l);transform:scaleX(0);transform-origin:left}
[dir=rtl] .prog i b{transform-origin:right}
.storyhead{position:absolute;top:104px;inset-inline-start:0;z-index:3}

/* stats */
.stats{background:var(--sand)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;text-align:center;border-top:1px solid #16120f22;padding-top:70px}
.stat b{display:block;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(4rem,10vw,8rem);line-height:1;color:var(--ink)}
.stat b sup{font-size:.4em;color:var(--gold);vertical-align:top;margin-inline-start:6px}
.stat span{display:block;margin-top:14px;color:var(--muted);font-size:.95rem}
.statgrid .stars{font-size:1.2rem;margin-top:10px;display:block}
.stats .big{font-size:clamp(2rem,4.4vw,3.6rem);max-width:20ch;margin:0 auto 70px;text-align:center}

/* offer */
.offer{background:var(--ink);color:var(--ivory);overflow:hidden}
.offer .glow{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,#b08d5744,transparent 65%);inset-inline-start:50%;top:50%;transform:translate(-50%,-50%)}
.offer .top{text-align:center;max-width:720px;margin:0 auto 70px;position:relative}
.offer .top h2{margin:20px 0 18px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:28px;max-width:960px;margin:0 auto;position:relative}
.plan{border:1px solid #d6bb8855;padding:50px 40px;text-align:center;position:relative;background:linear-gradient(180deg,#ffffff08,transparent);transition:transform .6s var(--ease),border-color .4s}
.plan:hover{transform:translateY(-8px);border-color:var(--gold-l)}
.plan .tag{font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-l)}
html[lang=ar] .plan .tag{letter-spacing:.05em;font-size:.9rem}
.plan h3{font-size:2.2rem;margin:10px 0 28px}
.price{font-family:'Cormorant Garamond',serif;font-size:clamp(3.6rem,7vw,5.6rem);line-height:1;color:var(--gold-l);font-weight:300}
.price small{font-size:.28em;margin-inline-start:8px;letter-spacing:.1em;font-family:var(--f-body)}
.was{margin:12px 0 28px;color:#9a8e7e;text-decoration:line-through;font-size:1.05rem}
.plan ul{list-style:none;margin-bottom:34px;color:#cdbfab;font-size:.95rem}
.plan li{padding:9px 0;border-top:1px solid #ffffff14}
.plan li:last-child{border-bottom:1px solid #ffffff14}

/* AI */
.ai{background:var(--ivory)}
.aiwrap{display:grid;grid-template-columns:.9fr 1.1fr;gap:70px;align-items:start}
.aiwrap h2{margin:20px 0 22px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.chips span{padding:8px 16px;border:1px solid #16120f26;border-radius:99px;font-size:.82rem;color:var(--muted)}
.panel{background:var(--ink);color:var(--ivory);border-radius:10px;padding:clamp(28px,4vw,52px);min-height:520px;position:relative;overflow:hidden;box-shadow:0 50px 90px -50px #16120f}
.panel::before{content:"";position:absolute;inset-inline-end:-120px;top:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,#b08d5755,transparent 70%)}
.pbar{display:flex;gap:8px;margin-bottom:34px;position:relative}
.pbar i{flex:1;height:2px;background:#ffffff22;position:relative;overflow:hidden}
.pbar i::after{content:"";position:absolute;inset:0;background:var(--gold-l);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
[dir=rtl] .pbar i::after{transform-origin:right}
.pbar i.on::after{transform:scaleX(1)}
.q{position:relative}
.q small{color:var(--gold-l);letter-spacing:.25em;font-size:.72rem;text-transform:uppercase}
html[lang=ar] .q small{letter-spacing:.05em;font-size:.85rem}
.q h3{font-size:clamp(1.8rem,3.4vw,2.6rem);margin:12px 0 30px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{text-align:start;padding:18px 20px;border:1px solid #ffffff26;border-radius:6px;font-size:.98rem;transition:.35s var(--ease);position:relative;overflow:hidden}
.opt:hover{border-color:var(--gold-l);background:#d6bb881a;transform:translateY(-2px)}
.opt.sel{background:var(--gold);border-color:var(--gold);color:#fff}
.back{margin-top:26px;font-size:.85rem;color:#b9ad9d;border-bottom:1px solid #ffffff33}
.analyzing{display:none;text-align:center;padding:50px 0;position:relative}
.analyzing.on{display:block}
.scan{width:120px;height:120px;margin:0 auto 32px;position:relative}
.scan svg{width:100%;height:100%;animation:spin 3s linear infinite}
.scan i{position:absolute;inset:34px;border-radius:50%;background:radial-gradient(circle,var(--gold-l),var(--gold));animation:pulse 1.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(.7);opacity:.6}}
.alog{height:28px;font-family:var(--f-disp);font-size:1.5rem;color:var(--gold-l);overflow:hidden}
.result{display:none;position:relative}
.result.on{display:block}
.result .tag{color:var(--gold-l);letter-spacing:.25em;font-size:.72rem;text-transform:uppercase}
html[lang=ar] .result .tag{letter-spacing:.05em;font-size:.85rem}
.result h3{font-size:clamp(2rem,4vw,3rem);margin:12px 0 16px}
.result p{color:#c9bca9;margin-bottom:22px}
.steps{list-style:none;margin:0 0 26px;counter-reset:s}
.steps li{counter-increment:s;padding:12px 0;border-top:1px solid #ffffff1c;display:flex;gap:16px;font-size:.96rem}
.steps li::before{content:"0" counter(s);font-family:'Cormorant Garamond',serif;color:var(--gold-l);font-size:1.1rem}
.rprice{background:#ffffff0d;border:1px solid #d6bb8844;border-radius:8px;padding:20px 22px;margin-bottom:24px}
.seg{display:inline-flex;border:1px solid #ffffff33;border-radius:99px;padding:3px;margin-bottom:14px}
.seg button{padding:6px 18px;border-radius:99px;font-size:.84rem;transition:.3s}
.seg button.on{background:var(--gold);color:#fff}
.rprice .pp{font-family:'Cormorant Garamond',serif;font-size:2.6rem;color:var(--gold-l);line-height:1}
.rprice s{color:#9a8e7e;margin-inline-start:12px;font-size:1rem}
.rprice small{display:block;color:#b9ad9d;margin-top:6px}
.disc{font-size:.76rem;color:#9a8e7e;margin-top:16px}
.rbtns{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.wa{background:#25D366;color:#06210f;font-weight:500}
.wa::before{background:#128c4a!important}
.wa:hover{color:#fff}

/* visit */
.visit{background:var(--sand)}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:70px}
.vgrid h2{margin:20px 0 30px}
.addr{font-size:1.1rem;margin-bottom:34px}
.addr b{font-weight:500;display:block;font-family:var(--f-disp);font-size:1.7rem}
.hours{list-style:none;border-top:1px solid #16120f26}
.hours li{display:flex;justify-content:space-between;padding:15px 4px;border-bottom:1px solid #16120f1a;transition:.3s}
.hours li.today{color:var(--gold);padding-inline:14px;background:#b08d5714}
.hours li.closed span:last-child{color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:10px;margin-bottom:22px;font-size:.9rem;padding:8px 18px;border-radius:99px;background:#fff9;border:1px solid #16120f1a}
.status i{width:8px;height:8px;border-radius:50%;background:#aaa}
.status.open i{background:#2fa564;box-shadow:0 0 0 0 #2fa56488;animation:ping 2s infinite}
.status.shut i{background:#b5533c}
@keyframes ping{70%{box-shadow:0 0 0 10px #2fa56400}100%{box-shadow:0 0 0 0 #2fa56400}}
.mapcard{position:relative;border-radius:6px;overflow:hidden;min-height:420px;background:var(--ink);color:var(--ivory);display:flex;flex-direction:column;justify-content:flex-end;padding:34px}
.mapcard svg.grid{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.pin{position:absolute;top:36%;inset-inline-start:48%;width:22px;height:22px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 8px #b08d5733}
.pin::after{content:"";position:absolute;inset:-26px;border:1px solid var(--gold);border-radius:50%;animation:ripple 2.4s infinite}
@keyframes ripple{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
.mapcard .btn{align-self:flex-start;position:relative}

/* footer */
footer{background:var(--ink);color:var(--ivory);padding:120px 0 40px;text-align:center;overflow:hidden}
footer h2{font-size:clamp(2.6rem,7vw,6rem);max-width:14ch;margin:20px auto 40px}
footer h2 em{color:var(--gold-l);font-style:italic}
html[lang=ar] footer h2 em{font-style:normal}
.fbot{margin-top:100px;padding-top:30px;border-top:1px solid #ffffff1c;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:#9a8e7e;font-size:.84rem}
.fbot a:hover{color:var(--gold-l)}

/* floating */
.fwa{position:fixed;z-index:80;inset-inline-end:22px;bottom:22px;width:62px;height:62px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 14px 34px -8px #25D366aa;transition:transform .4s var(--ease)}
.fwa:hover{transform:scale(1.1) rotate(-6deg)}
.fwa svg{width:32px;height:32px;fill:#fff}
.fwa::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #25D366;animation:ripple 2.6s infinite}
.cur{position:fixed;top:0;left:0;z-index:9998;pointer-events:none;mix-blend-mode:normal;display:none}

};
let lang=localStorage.getItem('lw_lang')||'ar';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const wa=m=>`https://wa.me/${NUMBER}?text=${encodeURIComponent(m)}`;

function applyLang(){
  const t=T[lang];
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.title=lang==='ar'?"عيادات لايف ويز | الرياض":"Life Way's Clinics | Riyadh";
  $('#langBtn').textContent=lang==='ar'?'EN':'عربي';
  $$('[data-i18n]').forEach(e=>{const v=t[e.dataset.i18n];if(typeof v==='string')e.textContent=v});
  $('#h1').innerHTML=`<span class="ln"><span>${t.h_l1}</span></span><span class="ln"><span><em>${t.h_l2}</em></span></span><span class="ln"><span>${t.h_l3}</span></span>`;
  if(window.__heroShown)$$('.hero h1 .ln>span').forEach(s=>s.style.transform='none');
  $('#fh').innerHTML=t.f_h;
  $('#marq').innerHTML=[...t.mq,...t.mq,...t.mq,...t.mq].map(x=>`<span>${x}</span>`).join('');
  $$('.wabtn').forEach(a=>{const k=a.dataset.msg;a.href=wa(k?t[k]:t.msg_base)});
  $('#mapLink').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent("Life Way's Clinics Al Mursalat Abi Bakr As Siddiq Rd Riyadh");
  buildHours();renderQuiz(true);
}
function buildHours(){
  const t=T[lang];
  const hrs={0:[12,22],1:[12,22],2:[12,22],3:[12,22],4:[12,21],5:null,6:[12,22]};
  const order=[6,0,1,2,3,4,5];
  const fmt=h=>{const x=h%12||12;return lang==='ar'?`${x}:00 ${h<12?'ص':'م'}`:`${x}:00 ${h<12?'AM':'PM'}`};
  const now=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Riyadh'}));
  const dd=now.getDay(),hh=now.getHours()+now.getMinutes()/60;
  $('#hours').innerHTML=order.map(d=>{const h=hrs[d];return `<li class="${d===dd?'today':''} ${h?'':'closed'}"><span>${t.d[d]}</span><span>${h?fmt(h[0])+' – '+fmt(h[1]):t.closedTxt}</span></li>`}).join('');
  const h=hrs[dd],open=h&&hh>=h[0]&&hh<h[1];
  const s=$('#status');s.className='status '+(open?'open':'shut');$('span',s).textContent=open?t.openNow:t.shutNow;
}

/* ---------- AI quiz ---------- */
const Q=[{k:'skin',q:'q1',o:['dry','oily','combo','sens','norm']},{k:'concern',q:'q2',o:['acne','pig','hair','dull','unsure']},{k:'goal',q:'q3',o:['clear','tone','smooth','glow','consult']}];
let step=0,ans={},busy=false,gender='women',phase='q';
function renderQuiz(keep){
  const t=T[lang];
  if(!keep){step=0;ans={};phase='q'}
  $('#anl').classList.remove('on');$('#res').classList.toggle('on',phase==='r');$('#q').style.display=phase==='q'?'':'none';
  $('#pbar').style.display='';
  $$('#pbar i').forEach((i,n)=>i.classList.toggle('on',phase==='r'||n<=step));
  if(phase==='r'){showResult(true);return}
  const d=Q[step];
  $('#q').innerHTML=`<small>${t.stepWord} ${step+1} / 3 — ${t.steps[step]}</small><h3>${t[d.q]}</h3><div class="opts">${d.o.map(o=>`<button class="opt ${ans[d.k]===o?'sel':''}" data-v="${o}">${t[d.k][o]}</button>`).join('')}</div>${step>0?`<button class="back">← ${t.back}</button>`:''}`;
  $$('#q .opt').forEach(b=>b.onclick=()=>{ans[d.k]=b.dataset.v;b.classList.add('sel');
    setTimeout(()=>{if(step<2){step++;renderQuiz(true);if(hasGsap&&!reduce)gsap.from('#q>*',{opacity:0,y:18,stagger:.06,duration:.5})}else analyze()},260)});
  const bk=$('#q .back');if(bk)bk.onclick=()=>{step--;renderQuiz(true)};
}
function pick(){
  const {skin,concern,goal}=ans;
  if(concern==='hair'||goal==='smooth'&&concern!=='acne'&&concern!=='pig')return 'laser';
  if(concern==='acne'||concern==='pig'||goal==='clear'||goal==='consult'||goal==='tone')return 'derm';
  if(concern==='dull'||goal==='glow')return 'cos';
  return skin==='sens'?'derm':'cos';
}
function analyze(){
  if(busy)return;busy=true;const t=T[lang];
  $('#q').style.display='none';$('#pbar').style.display='none';$('#anl').classList.add('on');
  const log=$('#alog');let i=0;log.textContent=t.analyzing[0];
  const iv=setInterval(()=>{i++;if(i<t.analyzing.length){log.textContent=t.analyzing[i];if(hasGsap&&!reduce)gsap.fromTo(log,{y:14,opacity:0},{y:0,opacity:1,duration:.4})}},780);
  setTimeout(()=>{clearInterval(iv);busy=false;phase='r';$('#anl').classList.remove('on');$('#pbar').style.display='';$$('#pbar i').forEach(i=>i.classList.add('on'));showResult(false)},reduce?600:3300);
}
function showResult(silent){
  const t=T[lang],r=pick(),res=$('#res');
  const H=t[r+'H'],P=t[r+'P']+(ans.skin==='sens'&&r!=='derm'?t.sensNote:''),S=t[r+'S'];
  const sk=t.skin[ans.skin],co=t.concern[ans.concern],go=t.goal[ans.goal];
  const priceBlock=r==='laser'?`<div class="rprice"><div class="seg"><button data-g="women" class="${gender==='women'?'on':''}">${t.forWomen}</button><button data-g="men" class="${gender==='men'?'on':''}">${t.forMen}</button></div><div class="pp">${gender==='men'?'1,500':'1,199'} ${t.sar}<s>${gender==='men'?'2,500':'2,000'}</s></div><small>${t.o_t}</small></div>`:'';
  res.innerHTML=`<span class="tag">${t.rtag}</span><h3>${H}</h3><p>${P}</p><ul class="steps">${S.map(s=>`<li>${s}</li>`).join('')}</ul>${priceBlock}<div class="rbtns"><a class="btn wa magnetic" id="rwa" target="_blank" rel="noopener"><span>${t.rbook}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><button class="back" id="redo">${t.redo}</button></div><p class="disc">${t.disc}</p>`;
  const setLink=()=>{let m=t.msg_ai(H+(r==='laser'?` (${gender==='men'?t.forMen+' 1,500':t.forWomen+' 1,199'} ${t.sar})`:''),sk,co,go);$('#rwa').href=wa(m)};
  setLink();
  $$('.seg button',res).forEach(b=>b.onclick=()=>{gender=b.dataset.g;showResult(true)});
  $('#redo').onclick=()=>{phase='q';renderQuiz(false)};
  res.classList.add('on');
  if(hasGsap&&!reduce&&!silent)gsap.from('#res>*',{opacity:0,y:24,stagger:.08,duration:.7,ease:'power3.out'});
}

/* ---------- init ---------- */
$('#yr').textContent=new Date().getFullYear();
$('#langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('lw_lang',lang);applyLang();if(hasGsap)ScrollTrigger.refresh()};
const burger=$('#burger'),menu=$('#menu');
burger.onclick=()=>{burger.classList.toggle('on');menu.classList.toggle('on')};
$$('#menu a').forEach(a=>a.addEventListener('click',()=>{burger.classList.remove('on');menu.classList.remove('on')}));
applyLang();

/* ---------- motion ---------- */
let lenis=null;
function initMotion(){
  gsap.registerPlugin(ScrollTrigger);
  if(!reduce&&window.Lenis){
    lenis=new Lenis({duration:1.15,smoothWheel:true,wheelMultiplier:.9});
    lenis.on('scroll',ScrollTrigger.update);
    gsap.ticker.add(t=>lenis.raf(t*1000));gsap.ticker.lagSmoothing(0);
    $$('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{const id=a.getAttribute('href');if(id.length>1&&$(id)){e.preventDefault();lenis.scrollTo(id,{offset:-10})}}));
  }
  if(reduce){$$('.count').forEach(c=>{c.textContent=fmtN(c)});}
  else{
    // reveals
    $$('.rv').forEach(el=>gsap.to(el,{opacity:1,y:0,duration:1.1,ease:'power3.out',scrollTrigger:{trigger:el,start:'top 88%'}}));
    // counters
    $$('.count').forEach(c=>{const to=+c.dataset.to,dec=+(c.dataset.dec||0),o={v:0};
      ScrollTrigger.create({trigger:c,start:'top 90%',once:true,onEnter:()=>gsap.to(o,{v:to,duration:2.2,ease:'power2.out',onUpdate:()=>c.textContent=fmt(o.v,dec)})})});
    // parallax
    $$('[data-speed]').forEach(el=>{const s=+el.dataset.speed;if(!s)return;
      gsap.to(el,{yPercent:s*-100,ease:'none',scrollTrigger:{trigger:el.closest('section')||el,start:'top bottom',end:'bottom top',scrub:true}})});
    // header
    let last=0;ScrollTrigger.create({start:0,end:'max',onUpdate:s=>{const y=s.scroll();$('#hdr').classList.toggle('solid',y>60);$('#hdr').classList.toggle('hide',y>last&&y>400);last=y}});
    // pinned story (desktop)
    const mm=gsap.matchMedia();
    mm.add('(min-width: 981px)',()=>{
      const steps=$$('.story .step'),arts=$$('.story .art'),bars=$$('.prog b');
      gsap.set(steps.slice(1),{opacity:0,y:50});gsap.set(arts.slice(1),{opacity:0,scale:.9});
      const tl=gsap.timeline({scrollTrigger:{trigger:'#story',start:'top top',end:'+=260%',pin:true,scrub:.6,anticipatePin:1,
        onUpdate:s=>{const p=s.progress*3;bars.forEach((b,i)=>gsap.set(b,{scaleX:Math.min(1,Math.max(0,p-i))}))}}});
      arts.forEach((a,i)=>gsap.to(a.querySelector('svg'),{rotate:i%2?-25:25,ease:'none',scrollTrigger:{trigger:'#story',start:'top top',end:'+=260%',scrub:true}}));
      for(let i=0;i<2;i++){
        tl.to(steps[i],{opacity:0,y:-50,duration:1},i*1.4+1).to(arts[i],{opacity:0,scale:1.1,duration:1},'<')
          .to(steps[i+1],{opacity:1,y:0,duration:1},'>-.2').to(arts[i+1],{opacity:1,scale:1,duration:1},'<');
      }
      tl.to({},{duration:.8});
      return()=>{gsap.set([...steps,...arts],{clearProps:'all'})};
    });
    mm.add('(max-width: 980px)',()=>{$$('.story .step').forEach(s=>gsap.from(s,{opacity:0,y:40,duration:1,scrollTrigger:{trigger:s,start:'top 85%'}}))});
    // hero orb mouse drift
    if(matchMedia('(hover:hover)').matches){addEventListener('mousemove',e=>{const x=(e.clientX/innerWidth-.5),y=(e.clientY/innerHeight-.5);
      gsap.to('.o1',{x:x*-30,duration:1.2,overwrite:'auto'});gsap.to('.o3',{x:x*40,y:y*30,duration:1.4,overwrite:'auto'})})}
  }
  // card spotlight
  $$('.card').forEach(c=>c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')}));
  // magnetic
  if(!reduce&&matchMedia('(hover:hover)').matches)document.addEventListener('pointermove',e=>{
    $$('.magnetic').forEach(b=>{const r=b.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
      if(Math.hypot(dx,dy)<90)gsap.to(b,{x:dx*.25,y:dy*.35,duration:.4});else gsap.to(b,{x:0,y:0,duration:.6,ease:'elastic.out(1,.5)'})})});
}
function fmt(v,dec){return dec?v.toFixed(dec):Math.round(v).toLocaleString('en-US')}
function fmtN(c){return fmt(+c.dataset.to,+(c.dataset.dec||0))}

/* cursor */
if(!reduce&&matchMedia('(hover:hover) and (pointer:fine)').matches){
  document.body.classList.add('has-cur');
  const d=$('#cd'),r=$('#cr');let x=innerWidth/2,y=innerHeight/2,rx=x,ry=y;
  addEventListener('mousemove',e=>{x=e.clientX;y=e.clientY;d.style.transform=`translate(${x}px,${y}px)`});
  (function loop(){rx+=(x-rx)*.16;ry+=(y-ry)*.16;r.style.transform=`translate(${rx}px,${ry}px)`;requestAnimationFrame(loop)})();
  document.addEventListener('pointerover',e=>{r.classList.toggle('h',!!e.target.closest('a,button,.card,.opt'))});
}

/* intro */
function finishIntro(){
  const L=$('#loader');if(!L||L.dataset.done)return;L.dataset.done=1;
  if(hasGsap&&!reduce){gsap.to(L,{yPercent:-100,duration:1.1,ease:'power4.inOut',onComplete:()=>L.remove()})}else L.remove();
}
function intro(){
  if(hasGsap&&!reduce){
    initMotion();
    gsap.set('.hero h1 .ln>span',{yPercent:110});
    gsap.set('#lwtxt span',{yPercent:110});
    const tl=gsap.timeline({onComplete:()=>{
      finishIntro();
      gsap.to('.hero h1 .ln>span',{yPercent:0,duration:1.3,ease:'power4.out',stagger:.12,delay:.5,onComplete:()=>{window.__heroShown=true}});
    }});
    tl.to('#lwtxt span',{yPercent:0,duration:.9,stagger:.12,ease:'power4.out'})
      .to('#loader .bar i',{scaleX:1,duration:1,ease:'power2.inOut'},'<.2')
      .to('#loader small',{opacity:1,duration:.6},'<.4')
      .to({},{duration:.3});
  }else{
    const l=$('#loader');if(l)l.remove();window.__heroShown=true;
  }
}
if(hasGsap){addEventListener('load',()=>setTimeout(intro,60));}
else{addEventListener('load',()=>{$('#loader').remove();$$('.count').forEach(c=>c.textContent=fmtN(c))})}
setTimeout(()=>{if($('#loader')){finishIntro();if(hasGsap)gsap.to('.hero h1 .ln>span',{yPercent:0,duration:.8});window.__heroShown=true}},6000);
})();
</script>
