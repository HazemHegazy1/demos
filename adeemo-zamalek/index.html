<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout concept: one long night scroll. A gold sun disc sinks into an animated Nile under the hero, then bands of deep blue split by zigzag borders; lotus marks every heading. */
:root{
  color-scheme: dark;
  --night:#0a1230; --night-2:#101a45; --ink:#060a1f;
  --gold:#e6b450; --gold-soft:#f4d98f; --ember:#e0703f;
  --nile:#2b9199; --nile-deep:#14545e;
  --papyrus:#f5e9c8; --muted:#aab3d3; --line:rgba(230,180,80,.3);
  --f-display:'Reem Kufi','Cairo',system-ui,sans-serif;
  --f-body:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--night);color:var(--papyrus);font-family:var(--f-body);font-size:16px;line-height:1.7;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--ink)}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{max-width:1120px;margin-inline:auto;min-width:0}
section[id]{scroll-margin-top:76px}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:rgba(6,10,31,.84);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:10px;min-height:62px}
.sp{flex:1}
.brand{display:flex;flex-direction:column;line-height:1;font-family:var(--f-display);color:var(--gold);font-size:1.7rem;font-weight:700}
.brand small{font-family:var(--f-body);font-size:.6rem;letter-spacing:.34em;color:var(--muted);margin-top:4px;font-weight:600}
.nav-links a{color:var(--muted);padding:.4rem .8rem;border-radius:999px;font-weight:500;transition:color .2s,background .2s}
.nav-links a:hover{color:var(--gold-soft);background:rgba(230,180,80,.1)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:46px;padding:.7rem 1.4rem;border-radius:999px;border:1px solid transparent;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}
.btn svg{flex:none}
.btn-gold{background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#1a1204;box-shadow:0 8px 24px rgba(230,180,80,.25)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(230,180,80,.42)}
.btn-ghost{border-color:var(--line);color:var(--papyrus);background:rgba(255,255,255,.04)}
.btn-ghost:hover{background:rgba(230,180,80,.14);transform:translateY(-2px)}
.btn-sm{min-height:40px;padding:.4rem 1rem;font-size:.92rem}
.btn-pulse{animation:ring 2.8s ease-out infinite}
@keyframes ring{0%{box-shadow:0 8px 24px rgba(230,180,80,.25),0 0 0 0 rgba(230,180,80,.5)}70%,100%{box-shadow:0 8px 24px rgba(230,180,80,.25),0 0 0 16px rgba(230,180,80,0)}}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--ink) 0%,#0c1740 52%,#1b2b63 100%);padding-top:2.4rem}
.stars-layer{position:absolute;inset:0;pointer-events:none;direction:ltr}
.star{position:absolute;border-radius:50%;background:var(--gold-soft);animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.hero-inner{position:relative;z-index:3}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(4.4rem,22vw,9.5rem);line-height:1.05;color:var(--gold);text-shadow:0 0 44px rgba(230,180,80,.35);margin:.6rem 0 0}
.hero-sub{font-family:var(--f-display);font-size:clamp(1.3rem,5vw,2rem);color:var(--papyrus);margin:.2rem 0 .6rem;text-wrap:balance}
.hero-p{max-width:46ch;color:var(--muted);font-size:1.05rem;margin:0 0 1.5rem}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) var(--d,0s) both}
@keyframes rise{from{opacity:.35;transform:translateY(16px)}to{opacity:1;transform:none}}
.chip{display:inline-flex;align-items:center;gap:.45rem;padding:.3rem .85rem;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.05);font-size:.9rem;color:var(--papyrus)}
.chip svg{color:var(--gold)}
.lot{width:18px;height:17px;color:var(--gold)}

.scene{position:relative;direction:ltr;height:clamp(250px,56vw,360px);margin-top:1.2rem}
.sun{position:absolute;left:50%;bottom:30%;width:min(60vw,290px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 50% 38%,#ffeab4 0%,#f1bf58 46%,#d9803a 100%);box-shadow:0 0 90px 24px rgba(230,150,60,.32)}
.sun::before{content:"";position:absolute;inset:-34%;border-radius:50%;background:repeating-conic-gradient(rgba(244,217,143,.26) 0 4deg,transparent 4deg 15deg);-webkit-mask:radial-gradient(circle closest-side,transparent 0 58%,#000 62%,transparent 100%);mask:radial-gradient(circle closest-side,transparent 0 58%,#000 62%,transparent 100%);animation:spin 100s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:640px){.sun{width:44vw}}
.reflect{position:absolute;left:50%;bottom:4%;width:min(40vw,190px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px;z-index:2}
.reflect i{display:block;height:3px;border-radius:3px;background:var(--gold-soft);animation:shim 2.4s ease-in-out infinite}
.reflect i:nth-child(1){width:100%}.reflect i:nth-child(2){width:78%;animation-delay:.3s}.reflect i:nth-child(3){width:56%;animation-delay:.6s}.reflect i:nth-child(4){width:34%;animation-delay:.9s}
@keyframes shim{0%,100%{opacity:.15;transform:scaleX(.8)}50%{opacity:.7;transform:scaleX(1)}}
.boat{position:absolute;left:0;bottom:32%;width:88px;z-index:1;animation:sail 38s linear infinite}
.boat svg{display:block;width:100%;animation:bob 3.4s ease-in-out infinite}
@keyframes sail{from{transform:translateX(-120px)}to{transform:translateX(calc(100vw + 40px))}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(5px) rotate(1.5deg)}}
.wave{position:absolute;left:0;bottom:0;width:200%;animation:drift var(--s,16s) linear infinite var(--dir,normal)}
.wave svg{display:block;width:100%;height:100%}
.wave path{fill:var(--c)}
@keyframes drift{to{transform:translateX(-50%)}}

/* bands + headings */
.band{padding-block:4.2rem}
.band.alt{background:var(--night-2)}
.zig{height:12px;opacity:.55;background:linear-gradient(135deg,var(--gold) 25%,transparent 25%) -6px 0,linear-gradient(225deg,var(--gold) 25%,transparent 25%) -6px 0;background-size:12px 12px;background-color:transparent}
.sec-head{display:flex;align-items:center;gap:.8rem;margin-bottom:.5rem}
.sec-head svg{width:32px;height:30px;color:var(--gold);flex:none}
.sec-head h2,.mm h2{font-family:var(--f-display);font-weight:700;font-size:clamp(1.8rem,6.4vw,2.7rem);line-height:1.2;color:var(--gold);margin:0;text-wrap:balance}
.sec-head::after{content:"";flex:1;min-width:20px;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
html[dir=rtl] .sec-head::after{background:linear-gradient(270deg,var(--line),transparent)}
.sub{color:var(--muted);max-width:60ch;margin:0 0 2rem}

/* nile section */
.feat{display:flex;gap:1rem;padding-block:1.1rem;border-top:1px solid var(--line)}
.feat:first-child{border-top:0}
.feat .ic{flex:none;width:46px;height:46px;border-radius:50% 50% 12px 12px;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold)}
.feat h3{margin:0;font-family:var(--f-display);font-size:1.3rem;color:var(--papyrus);font-weight:600}
.feat p{margin:.1rem 0 0;color:var(--muted)}
.stage{position:relative;width:min(100%,330px);margin-inline:auto;aspect-ratio:4/5;border-radius:999px 999px 24px 24px;border:2px solid var(--gold);box-shadow:0 0 0 8px var(--night),0 0 0 9px var(--line);background:radial-gradient(80% 55% at 50% 32%,rgba(230,150,60,.34),transparent 72%),linear-gradient(180deg,#17265f,#0a1230);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1rem;padding:2rem 1.4rem 1.5rem;overflow:hidden}
.stage .oud{width:46%;color:var(--gold);flex:none;filter:drop-shadow(0 0 18px rgba(230,150,60,.5));animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.live{display:inline-flex;align-items:center;gap:.45rem;font-weight:700;letter-spacing:.2em;font-size:.78rem;color:var(--ember)}
.live::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ember);animation:blink 1.3s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.eq{display:flex;align-items:flex-end;gap:5px;height:70px;direction:ltr}
.eq i{display:block;width:7px;height:25%;border-radius:4px 4px 0 0;background:linear-gradient(var(--gold-soft),var(--ember));animation:eq 1.2s ease-in-out infinite}
@keyframes eq{0%,100%{height:18%}50%{height:100%}}
.stage-cap{font-family:var(--f-display);color:var(--papyrus);font-size:1.1rem}

/* open till 6 */
.big6{font-family:var(--f-display);font-weight:700;line-height:.9;font-size:clamp(6rem,30vw,12rem);background:linear-gradient(180deg,var(--gold-soft),var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;align-items:flex-end;gap:.6rem;direction:ltr}
.big6 small{font-size:clamp(1.4rem,5vw,2.2rem);color:var(--gold-soft);-webkit-text-fill-color:var(--gold-soft);padding-bottom:.9rem}
.track{position:relative;direction:ltr;height:14px;border-radius:999px;background:linear-gradient(90deg,#070c24,#262c69 55%,#d9803a 86%,var(--gold-soft));margin:2.4rem 0 .8rem}
.mover{position:absolute;top:50%;left:3%;width:34px;height:34px;border-radius:50%;transform:translate(-50%,-50%);background:#e9edff;box-shadow:0 0 20px #9aa7ff;animation:mv 9s ease-in-out infinite alternate}
@keyframes mv{to{left:97%;background:#ffe3a0;box-shadow:0 0 34px #f0bd55}}
.ticks{display:flex;justify-content:space-between;direction:ltr;color:var(--muted);font-size:.9rem}
.ticks span:last-child{color:var(--gold-soft);font-weight:700}

/* menu */
.sample-banner{display:flex;gap:.7rem;align-items:flex-start;border:1px dashed var(--gold);border-radius:14px;padding:.85rem 1rem;color:var(--gold-soft);background:rgba(230,180,80,.07);margin-bottom:1.3rem}
.sample-banner svg{flex:none;margin-top:3px}
.tabs{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.5rem;margin-bottom:1rem;scrollbar-width:thin}
.tab,.opt{white-space:nowrap;min-height:42px;padding:.4rem 1.1rem;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--papyrus);font-weight:600;cursor:pointer;transition:background .2s,color .2s,transform .2s}
.tab:hover,.opt:hover{background:rgba(230,180,80,.15)}
.tab[aria-selected=true],.opt[aria-pressed=true]{background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#1a1204;border-color:transparent}
.dishes{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.dish{position:relative;border:1px solid var(--line);border-radius:16px;padding:1.1rem 1rem;background:rgba(255,255,255,.03);animation:rise .5s ease both}
.dish h3{margin:0 0 .2rem;font-family:var(--f-display);font-size:1.3rem;color:var(--gold-soft);font-weight:600;display:flex;align-items:center;gap:.55rem}
.dish h3::before{content:"";width:8px;height:8px;background:var(--gold);transform:rotate(45deg);flex:none}
.dish p{margin:0;color:var(--muted);font-size:.95rem}
.stag{position:absolute;top:.7rem;inset-inline-end:.8rem;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 .5rem}
.foot-note{color:var(--muted);font-size:.9rem;margin-top:1.2rem}

/* matchmaker */
.mm{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:26px;padding:1.6rem 1.2rem;background:radial-gradient(120% 90% at 0% 0%,rgba(43,145,153,.26),transparent 58%),linear-gradient(180deg,#14215a,#0d1740)}
.mm::before{content:"";position:absolute;inset:8px;border:1px dashed rgba(230,180,80,.28);border-radius:20px;pointer-events:none}
.mm>*{position:relative}
.ai-badge{display:inline-flex;align-items:center;gap:.5rem;padding:.25rem .9rem;border-radius:999px;background:rgba(230,180,80,.14);border:1px solid var(--line);color:var(--gold-soft);font-weight:700;letter-spacing:.06em;font-size:.85rem;margin-bottom:.8rem;direction:ltr}
.q{font-family:var(--f-display);color:var(--gold-soft);font-size:1.15rem;margin:1.1rem 0 .55rem}
.opts{display:flex;flex-wrap:wrap;gap:.5rem}
.mm-out{margin-top:1.4rem;min-width:0}
.res{border:1px solid var(--gold);border-radius:20px;padding:1.2rem;background:rgba(6,10,31,.55);animation:rise .6s ease both}
.res-t{font-family:var(--f-display);font-size:1.6rem;color:var(--gold);margin:0;line-height:1.25}
.res-l{color:var(--papyrus);margin:.2rem 0 1rem}
.row{display:flex;align-items:center;gap:.8rem;padding:.65rem 0;border-top:1px solid var(--line)}
.row .role{flex:none;width:6.2rem;font-size:.78rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.row .nm{flex:1;min-width:0;font-family:var(--f-display);font-size:1.15rem;color:var(--papyrus)}
.qty{flex:none;border:1px solid var(--gold);border-radius:999px;padding:0 .7rem;color:var(--gold);font-weight:700;direction:ltr}
.res-act{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.1rem}
.think{display:flex;align-items:center;gap:.8rem;min-height:140px;border:1px dashed var(--line);border-radius:20px;padding:1.2rem;color:var(--gold-soft);font-weight:600}
.dots{display:inline-flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:dot 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}

/* events, rating, location */
.ev{display:flex;flex-direction:column;gap:.5rem;border:1px solid var(--line);border-radius:20px 20px 20px 4px;padding:1.2rem;background:rgba(255,255,255,.03);transition:transform .25s,background .25s}
html[dir=rtl] .ev{border-radius:20px 20px 4px 20px}
.ev:hover{transform:translateY(-4px);background:rgba(230,180,80,.08)}
.ev svg.ico{width:34px;height:34px;color:var(--gold)}
.ev h3{margin:0;font-family:var(--f-display);font-size:1.3rem;color:var(--gold-soft);font-weight:600}
.ev p{margin:0 0 .8rem;color:var(--muted)}
.ev .btn{margin-top:auto;align-self:flex-start}
.rate-num{font-family:var(--f-display);font-weight:700;font-size:clamp(5.5rem,24vw,9rem);line-height:.95;color:var(--gold);direction:ltr}
.stars{position:relative;display:inline-block;direction:ltr;font-size:2.2rem;line-height:1;letter-spacing:.14em;color:rgba(255,255,255,.18)}
.stars>span{position:absolute;top:0;left:0;bottom:0;width:86%;overflow:hidden;white-space:nowrap;color:var(--gold)}
.mapcard{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#0c1640}
.mapcard svg{display:block;width:100%;height:auto}
.pin-pulse{transform-origin:center;transform-box:fill-box;animation:pp 2.2s ease-out infinite}
@keyframes pp{from{transform:scale(.4);opacity:.9}to{transform:scale(2.6);opacity:0}}

/* footer + fab */
.foot{border-top:1px solid var(--line);background:var(--ink);padding-block:2.4rem 6.5rem}
.foot b{font-family:var(--f-display);font-size:1.3rem;color:var(--gold);font-weight:600}
.unoff{display:inline-block;margin-inline-start:.6rem;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:0 .7rem}
.foot p{color:var(--muted);font-size:.9rem;margin:.6rem 0 0;max-width:62ch}
.fab{position:fixed;z-index:50;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-end:calc(16px + max(env(safe-area-inset-left,0px),env(safe-area-inset-right,0px)));box-shadow:0 10px 30px rgba(0,0,0,.45)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
}
</style>

<header class="nav"><div class="gutter"><div class="shell nav-in">
  <a class="brand" href="#top"><span data-i="brand_big">قديمو</span><small data-i="brand_small">ADEEMO</small></a>
  <nav class="nav-links hidden md:flex items-center gap-1 ms-4">
    <a href="#nile" data-i="nav_nile"></a><a href="#menu" data-i="nav_menu"></a><a href="#match" data-i="nav_match"></a><a href="#events" data-i="nav_events"></a><a href="#location" data-i="nav_loc"></a>
  </nav>
  <span class="sp"></span>
  <button id="langBtn" class="btn btn-ghost btn-sm" type="button"></button>
  <a class="btn btn-gold btn-sm hidden sm:inline-flex" data-wa="general" target="_blank" rel="noopener"><svg width="18" height="18"><use href="#wa"/></svg><span data-i="reserve_short"></span></a>
</div></div></header>

<main>
<section class="hero" id="top">
  <div class="stars-layer" id="stars" aria-hidden="true"></div>
  <div class="gutter hero-inner"><div class="shell">
    <div class="rise" style="--d:.05s"><span class="chip"><svg class="lot"><use href="#lotus"/></svg><span data-i="hero_eyebrow"></span></span></div>
    <h1 class="rise" style="--d:.15s" data-i="brand_big">قديمو</h1>
    <p class="hero-sub rise" style="--d:.25s" data-i="hero_sub"></p>
    <p class="hero-p rise" style="--d:.35s" data-i="hero_p"></p>
    <div class="flex flex-wrap gap-3 rise" style="--d:.45s">
      <a class="btn btn-gold btn-pulse" data-wa="general" target="_blank" rel="noopener"><svg width="20" height="20"><use href="#wa"/></svg><span data-i="cta_reserve"></span></a>
      <a class="btn btn-ghost" href="#menu"><span data-i="cta_menu"></span></a>
    </div>
    <div class="flex flex-wrap gap-2 mt-6 rise" style="--d:.55s">
      <span class="chip"><svg width="16" height="16"><use href="#star"/></svg><span data-i="chip_rate"></span></span>
      <span class="chip"><span data-i="chip_open"></span></span>
      <span class="chip"><span data-i="chip_live"></span></span>
    </div>
  </div></div>
  <div class="scene" aria-hidden="true">

    pickles: ["starters", "مخلل مشكّل", "Mixed Pickles", "مخلل مشكّل على الجنب", "Mixed pickles on the side"],
    kebab: ["grills", "كباب", "Kebab", "كباب لحمة مشوي على الفحم", "Charcoal-grilled beef kebab"],
    kofta: ["grills", "كفتة مشوية", "Grilled Kofta", "كفتة متتبّلة على الفحم", "Spiced kofta over charcoal"],
    ribs: ["grills", "ريش ضاني", "Lamb Chops", "ريش ضاني مشوية", "Grilled lamb chops"],
    chicken: ["grills", "فراخ مشوية", "Grilled Chicken", "فراخ متتبّلة مشوية", "Marinated grilled chicken"],
    mixed: ["grills", "مشاوي مشكّلة", "Mixed Grill", "تشكيلة مشاوي للمشاركة", "A mixed grill platter to share"],
    okra: ["mains", "طاجن بامية باللحمة", "Okra Tagine with Beef", "بامية بصلصة الطماطم في طاجن فخار", "Okra in tomato sauce, clay-pot style"],
    molokhia: ["mains", "ملوخية بالفراخ", "Molokhia with Chicken", "ملوخية بالتقلية والفراخ", "Molokhia with garlic taqliya and chicken"],
    fattah: ["mains", "فتة لحمة", "Beef Fattah", "فتة بالأرز والخل والثوم واللحمة", "Fattah with rice, garlicky vinegar and beef"],
    mahshi: ["mains", "محشي مشكّل", "Mixed Mahshi", "كوسة وورق عنب وفلفل محشي", "Stuffed zucchini, vine leaves and peppers"],
    pigeon: ["mains", "حمام محشي بالفريك", "Pigeon with Freekeh", "حمام محشي فريك على الطريقة المصرية", "Pigeon stuffed with freekeh"],
    umali: ["desserts", "أم علي", "Om Ali", "أم علي سخنة بالمكسرات", "Warm Om Ali with nuts"],
    konafa: ["desserts", "كنافة بالقشطة", "Konafa with Cream", "كنافة مقرمشة بالقشطة والشيرة", "Crispy konafa with cream and syrup"],
    rice: ["desserts", "رز بلبن", "Rice Pudding", "رز بلبن بالقرفة", "Rice pudding with cinnamon"],
    basbousa: ["desserts", "بسبوسة", "Basbousa", "بسبوسة سميد بالشيرة", "Semolina cake soaked in syrup"],
    muhallabia: ["desserts", "مهلبية", "Muhallabia", "مهلبية باردة بالمكسرات", "Chilled milk pudding with nuts"],
    tea: ["drinks", "شاي بالنعناع", "Mint Tea", "شاي بالنعناع الفريش", "Tea with fresh mint"],
    coffee: ["drinks", "قهوة تركي", "Turkish Coffee", "قهوة تركي مظبوطة", "Turkish coffee, made to your taste"],
    erk: ["drinks", "عرقسوس", "Licorice Drink", "عرقسوس بارد", "Chilled licorice drink"],
    tamr: ["drinks", "تمر هندي", "Tamarind", "تمر هندي بارد", "Chilled tamarind"],
    sahlab: ["drinks", "سحلب", "Sahlab", "سحلب سخن بالمكسرات", "Hot sahlab with nuts"],
    karkadeh: ["drinks", "كركديه", "Hibiscus", "كركديه بارد", "Chilled hibiscus"]
  };

  var MOODS = {
    chill: {
      ar: "رايق", en: "Laid-back",
      tAr: "سهرة الرايقين", tEn: "The Laid-Back Night",
      lAr: ["ليلة نيل ومزاج. خد وقتك واشرب شايك على مهلك.", "مفيش استعجال هنا، النيل نفسه ماشي على مهله."],
      lEn: ["A Nile-and-mood kind of night. Take your time.", "No rush here. Even the Nile takes its time."],
      s: ["baba", "hummus", "salad", "pickles"], m: ["chicken", "kofta", "kebab", "okra"], d: ["rice", "muhallabia", "basbousa"], r: ["tea", "coffee", "tamr"]
    },
    romantic: {
      ar: "رومانسي", en: "Romantic",
      tAr: "عشا على ضوء النيل", tEn: "Dinner by Nile Light",
      lAr: ["شمعة ونيل ومزيكا. باقي عليك الكلام الحلو بس.", "الأكل والمزيكا جاهزين.. جهّز إنت الكلام الحلو."],
      lEn: ["Candlelight, the Nile and music. Bring the sweet talk.", "The food and the music are ready. The sweet talk is on you."],
      s: ["baba", "sambousek", "salad"], m: ["pigeon", "ribs", "chicken"], d: ["umali", "muhallabia"], r: ["karkadeh", "coffee", "tea"]
    },
    friends: {
      ar: "شلة وضحك", en: "Friends & laughs",
      tAr: "سهرة الشلة", tEn: "The Crew Night",
      lAr: ["الأكل كتير والضحك أكتر. اطلبوا وهاتوا الحكايات.", "اللي هياخد آخر حتة كفتة يبقى بيحبكم أوي (مزاح طبعاً)."],
      lEn: ["Lots of food, even more laughter. Order and bring the stories.", "Whoever grabs the last piece of kofta really loves you (joking)."],
      s: ["taameya", "sambousek", "salad", "pickles", "hummus"], m: ["mixed", "fattah", "kofta", "kebab"], d: ["konafa", "basbousa"], r: ["tamr", "karkadeh", "erk"]
    },
    comfort: {
      ar: "مدايق ومحتاج دلع", en: "Need some comfort",
      tAr: "دلع على الطريقة المصرية", tEn: "Egyptian-Style Comfort",
      lAr: ["الملوخية والبامية بيصلّحوا أي يوم وحش.", "النيل قدامك والأكل ده هيغيّر المود."],
      lEn: ["Molokhia and okra fix any bad day.", "The Nile in front of you and this food will turn your mood around."],
      s: ["soup", "baba", "salad"], m: ["molokhia", "okra", "fattah", "mahshi"], d: ["rice", "umali"], r: ["sahlab", "tea", "erk"]
    },
    celebrate: {
      ar: "احتفال", en: "Celebrating",
      tAr: "ليلة الفرحة", tEn: "The Celebration Night",
      lAr: ["مبروك مقدماً! الليلة دي تستاهل طاولة مليانة.", "عيد ميلاد ولا نجاح؟ أي سبب كويس لطاولة مليانة."],
      lEn: ["Congratulations in advance! Tonight deserves a full table.", "Birthday or a win? Any reason is a good reason for a full table."],
      s: ["sambousek", "hummus", "baba", "taameya"], m: ["mixed", "pigeon", "ribs", "fattah"], d: ["konafa", "umali", "basbousa"], r: ["karkadeh", "tamr", "coffee"]
    },
    nostalgia: {
      ar: "حنين للزمن الجميل", en: "Old-school nostalgia",
      tAr: "أكل زمان", tEn: "Old-Time Flavours",
      lAr: ["طعم زمان.. زي أكل البيت، بس على النيل.", "اسم المكان قديمو، والأكل ده يليق بالاسم."],
      lEn: ["Flavours of the old days, like home cooking, but on the Nile.", "The name is Adeemo, and this order fits it."],
      s: ["soup", "pickles", "salad", "taameya"], m: ["mahshi", "fattah", "okra", "molokhia"], d: ["basbousa", "rice", "umali"], r: ["erk", "coffee", "tea"]
    }
  };
  var MOOD_ORDER = ["chill", "romantic", "friends", "comfort", "celebrate", "nostalgia"];
  var GROUPS = [
    [1, { ar: "لوحدي", en: "Just me" }], [2, { ar: "اتنين", en: "Two" }], [4, { ar: "3-4", en: "3-4" }],
    [6, { ar: "5-8", en: "5-8" }], [10, { ar: "9+", en: "9+" }]
  ];
  var HUNGERS = [
    [0, { ar: "لقمة خفيفة", en: "A light bite" }], [1, { ar: "عادي", en: "Normal" }],
    [2, { ar: "جعان", en: "Hungry" }], [3, { ar: "جعان جداً", en: "Starving" }]
  ];
  var ROLES = {
    starter: { ar: "مقبلات", en: "Starter" }, main: { ar: "الطبق الرئيسي", en: "Main" },
    dessert: { ar: "حلو", en: "Dessert" }, drink: { ar: "مشروب", en: "Drink" }
  };
  var THINK = {
    ar: ["بقرا مزاجك...", "بحسب الشلة...", "بظبط الأطباق..."],
    en: ["Reading your mood...", "Counting the crew...", "Plating your order..."]
  };
  var WA_MSG = {
    ar: {
      general: "السلام عليكم، عايز أحجز طاولة في قديمو.\nعدد الأفراد: ____\nاليوم والميعاد: ____",
      birthday: "السلام عليكم، عايز أحجز عيد ميلاد في قديمو.\nعدد الأفراد: ____\nالتاريخ والميعاد: ____",
      anniv: "السلام عليكم، عايز أحجز لخطوبة أو ذكرى سنوية في قديمو.\nعدد الأفراد: ____\nالتاريخ والميعاد: ____",
      friends: "السلام عليكم، عايز أحجز لمّة أو حفلة تخرّج في قديمو.\nعدد الأفراد: ____\nالتاريخ والميعاد: ____",
      corp: "السلام عليكم، عايز أسأل عن مناسبة خاصة أو عشا فريق في قديمو.\nعدد الأفراد: ____\nالتاريخ والميعاد: ____"
    },
    en: {
      general: "Hello, I'd like to reserve a table at Adeemo.\nNumber of guests: ____\nDay and time: ____",
      birthday: "Hello, I'd like to book a birthday at Adeemo.\nNumber of guests: ____\nDate and time: ____",
      anniv: "Hello, I'd like to book an engagement or anniversary at Adeemo.\nNumber of guests: ____\nDate and time: ____",
      friends: "Hello, I'd like to book a reunion or graduation night at Adeemo.\nNumber of guests: ____\nDate and time: ____",
      corp: "Hello, I'd like to ask about a private or team event at Adeemo.\nNumber of guests: ____\nDate and time: ____"
    }
  };

  /* ---------- state ---------- */
  var lang = "ar";
  try { var saved = localStorage.getItem("adeemo-lang"); if (saved === "en" || saved === "ar") lang = saved; } catch (e) {}
  var cat = "starters";
  var st = { mood: "chill", g: 2, h: 1 };
  var last = null, matchMsg = "", token = 0, timer = null;

  function $(s) { return document.querySelector(s); }
  function $$(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function t(k) { return T[lang][k] != null ? T[lang][k] : k; }
  function dn(id) { return lang === "ar" ? D[id][1] : D[id][2]; }

  /* ---------- whatsapp ---------- */
  function waHref(msg) { return "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(msg); }
  function updateWA() {
    $$("a[data-wa]").forEach(function (a) {
      var k = a.getAttribute("data-wa");
      var msg = k === "match" ? matchMsg : (WA_MSG[lang][k] || WA_MSG[lang].general);
      a.setAttribute("href", waHref(msg));
    });
  }

  /* ---------- menu ---------- */
  function renderMenu() {
    var tabs = $("#tabs");
    tabs.innerHTML = CATS.map(function (c) {
      return '<button class="tab" type="button" role="tab" data-cat="' + c[0] + '" aria-selected="' + (c[0] === cat) + '">' + c[1][lang] + "</button>";
    }).join("");
    var list = Object.keys(D).filter(function (id) { return D[id][0] === cat; });
    $("#dishes").innerHTML = list.map(function (id, i) {
      var d = D[id];
      return '<article class="dish" style="animation-delay:' + (i * 60) + 'ms"><span class="stag">' + t("sample") + "</span><h3>" + dn(id) + "</h3><p>" + (lang === "ar" ? d[3] : d[4]) + "</p></article>";
    }).join("");
  }

  /* ---------- matchmaker ---------- */
  function renderOpts() {
    $("#optMood").innerHTML = MOOD_ORDER.map(function (k) {
      return '<button class="opt" type="button" data-k="mood" data-v="' + k + '" aria-pressed="' + (st.mood === k) + '">' + MOODS[k][lang] + "</button>";
    }).join("");
    $("#optGroup").innerHTML = GROUPS.map(function (g) {
      return '<button class="opt" type="button" data-k="g" data-v="' + g[0] + '" aria-pressed="' + (st.g === g[0]) + '">' + g[1][lang] + "</button>";
    }).join("");
    $("#optHunger").innerHTML = HUNGERS.map(function (h) {
      return '<button class="opt" type="button" data-k="h" data-v="' + h[0] + '" aria-pressed="' + (st.h === h[0]) + '">' + h[1][lang] + "</button>";
    }).join("");
  }
  function pick(arr, n) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; }
    return a.slice(0, n);
  }
  function dist(total, n) {
    total = Math.max(total, n);
    var b = Math.floor(total / n), r = total % n, out = [];
    for (var i = 0; i < n; i++) out.push(b + (i < r ? 1 : 0));
    return out;
  }
  function build() {
    var m = MOODS[st.mood], g = st.g, h = st.h;
    var big = g >= 5 ? 1 : 0, huge = g >= 9 ? 1 : 0;
    var sN = Math.min(m.s.length, [1, 1, 2, 3][h] + big);
    var mN = Math.min(m.m.length, [1, 1, 2, 2][h] + big + huge);
    var dBase = [0, 1, 1, 2][h];
    if (h === 0 && g >= 4) dBase = 1;
    var dN = Math.min(m.d.length, dBase);
    var rN = g >= 3 ? 2 : 1;
    var items = [];
    var sQ = dist(Math.ceil(g / 2), sN), mQ = dist(Math.ceil(g * [0.6, 0.8, 1, 1.3][h]), mN);
    pick(m.s, sN).forEach(function (id, i) { items.push({ role: "starter", id: id, q: sQ[i] }); });
    pick(m.m, mN).forEach(function (id, i) { items.push({ role: "main", id: id, q: mQ[i] }); });
    if (dN > 0) {
      var dQ = dist(Math.ceil(g * [0, 0.5, 0.7, 1][h]), dN);
      pick(m.d, dN).forEach(function (id, i) { items.push({ role: "dessert", id: id, q: dQ[i] }); });
    }
    var rQ = dist(g, rN);
    pick(m.r, rN).forEach(function (id, i) { items.push({ role: "drink", id: id, q: rQ[i] }); });
    return { mood: st.mood, g: g, items: items, li: Math.floor(Math.random() * m.lAr.length) };
  }
  function guests() { var f = GROUPS.filter(function (x) { return x[0] === st.g; })[0]; return f[1][lang]; }
  function renderResult() {
    var out = $("#mmOut");
    if (!last) return;
    var m = MOODS[last.mood];
    var rows = last.items.map(function (it) {
      return '<div class="row"><span class="role">' + ROLES[it.role][lang] + '</span><span class="nm">' + dn(it.id) + '</span><span class="qty">×' + it.q + "</span></div>";
    }).join("");
    var summary = last.items.map(function (it) { return dn(it.id) + " ×" + it.q; }).join("، ");
    if (lang === "en") summary = last.items.map(function (it) { return dn(it.id) + " x" + it.q; }).join(", ");
    matchMsg = lang === "ar"
      ? "السلام عليكم، عايز أحجز طاولة في قديمو.\nعدد الأفراد: " + guests() + "\nاليوم والميعاد: ____\n\nترشيح الطلب اللي عجبني (من المنيو العيّنة): " + summary
      : "Hello, I'd like to reserve a table at Adeemo.\nNumber of guests: " + guests() + "\nDay and time: ____\n\nThe sample order I liked: " + summary;
    out.innerHTML =
      '<div class="res"><p class="res-t">' + (lang === "ar" ? m.tAr : m.tEn) + '</p><p class="res-l">' + (lang === "ar" ? m.lAr[last.li] : m.lEn[last.li]) + "</p>" +
      rows +
      '<div class="res-act"><a class="btn btn-gold" data-wa="match" target="_blank" rel="noopener"><svg width="18" height="18"><use href="#wa"/></svg><span>' + t("mm_res") + '</span></a>' +
      '<button class="btn btn-ghost" type="button" id="again">' + t("mm_again") + "</button></div>" +
      '<p class="foot-note" style="margin:.9rem 0 0">' + t("mm_note") + "</p></div>";
    updateWA();
  }
  function runMatch(animate) {
    var my = ++token;
    clearTimeout(timer);
    if (!animate) { last = build(); renderResult(); return; }
    var steps = THINK[lang], i = 0, out = $("#mmOut");
    function show() {
      out.innerHTML = '<div class="think"><span class="dots"><i></i><i></i><i></i></span><span>' + steps[i] + "</span></div>";
    }
    show();
    (function next() {
      timer = setTimeout(function () {
        if (my !== token) return;
        i++;
        if (i < steps.length) { show(); next(); }
        else { last = build(); renderResult(); }
      }, 330);
    })();
  }

  /* ---------- language ---------- */
  function applyLang(l) {
    lang = l;
    var d = document.documentElement;
    d.setAttribute("lang", l);
    d.setAttribute("dir", l === "ar" ? "rtl" : "ltr");
    $$("[data-i]").forEach(function (el) { var v = T[l][el.getAttribute("data-i")]; if (v != null) el.textContent = v; });
    $("#langBtn").textContent = l === "ar" ? "EN" : "عربي";
    $("#langBtn").setAttribute("aria-label", l === "ar" ? "Switch to English" : "التبديل للعربية");
    renderMenu(); renderOpts(); renderResult(); updateWA();
    try { localStorage.setItem("adeemo-lang", l); } catch (e) {}
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("button,a") : null;
    if (!el) return;
    if (el.id === "langBtn") { applyLang(lang === "ar" ? "en" : "ar"); return; }
    if (el.classList.contains("tab")) { cat = el.getAttribute("data-cat"); renderMenu(); return; }
    if (el.classList.contains("opt")) {
      var k = el.getAttribute("data-k"), v = el.getAttribute("data-v");
      st[k] = k === "mood" ? v : parseInt(v, 10);
      renderOpts(); runMatch(true); return;
    }
    if (el.id === "again") { runMatch(true); return; }
    var href = el.getAttribute("href");
    if (href && href.charAt(0) === "#" && href.length > 1) {
      var target = document.getElementById(href.slice(1));
      if (target) { e.preventDefault(); target.scrollIntoView({ behavior: "smooth", block: "start" }); }
    }
  });

  /* ---------- decoration ---------- */
  var sl = $("#stars");
  for (var i = 0; i < 70; i++) {
    var s = document.createElement("i");
    s.className = "star";
    var sz = 1 + Math.random() * 2;
    s.style.cssText = "left:" + (Math.random() * 100).toFixed(1) + "%;top:" + (Math.random() * 62).toFixed(1) + "%;width:" + sz.toFixed(1) + "px;height:" + sz.toFixed(1) + "px;animation-delay:" + (Math.random() * 3).toFixed(2) + "s;animation-duration:" + (2.2 + Math.random() * 2.5).toFixed(2) + "s";
    sl.appendChild(s);
  }
  var eq = $("#eq");
  for (var j = 0; j < 18; j++) {
    var b = document.createElement("i");
    b.style.animationDelay = (-Math.random() * 1.4).toFixed(2) + "s";
    b.style.animationDuration = (0.8 + Math.random() * 0.9).toFixed(2) + "s";
    eq.appendChild(b);
  }

  applyLang(lang);
  runMatch(false);
})();
</script>

</body></html>
